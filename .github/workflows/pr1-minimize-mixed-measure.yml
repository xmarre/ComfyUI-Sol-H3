name: PR1 minimize mixed measure diff

on:
  push:
    branches:
      - mirror/pr1-flow-mixed-kv-measure

permissions:
  contents: write

jobs:
  minimize-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct semantic-only changes over the PR head
        run: |
          BASE=af4bbe62d507767dcecc4e6716548160f757dcf9
          FILES="sol_h3/runtime.py sol_h3/sparse.py tests/test_attention_guard.py tests/test_external_mixed.py"
          git diff -w "$BASE" HEAD -- $FILES > /tmp/semantic.patch
          git checkout "$BASE" -- $FILES
          git apply --ignore-whitespace /tmp/semantic.patch
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Validate semantic-only tree
        run: |
          ruff check sol_h3/mixed_measure.py sol_h3/runtime.py sol_h3/sparse.py tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py
          pytest -q tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py tests/test_interop.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/pr1-minimize-mixed-measure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Minimize Flow Mixed-Grid K/V integration diff'
          git push
