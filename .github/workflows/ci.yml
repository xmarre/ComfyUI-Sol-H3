name: CPU contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/Sana
          ref: 2936c47637380842aaa4a4488fac5006cc542b70
          path: _deps/Sana
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[test]'
      - run: pip install triton==3.6.0
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m pytest -q
        env:
          SANA_PATH: ${{ github.workspace }}/_deps/Sana
  windows-provenance:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "pytest>=8"
      - run: pip install -e . --no-deps
      - run: python -m pip check
      - name: Verify Windows provenance and fail-closed runtime contracts
        run: >-
          python -m pytest -q
          tests/test_sana_contract.py::test_provenance_and_node_local_imports
          tests/test_sana_contract.py::test_manifest_names_are_platform_independent
          tests/test_sana_contract.py::test_git_crlf_checkout_preserves_provenance
          tests/test_sana_contract.py::test_tampered_source_cannot_claim_verified
          tests/test_sana_contract.py::test_native_windows_missing_cute_reports_supported_path
          tests/test_native_execution.py::test_native_windows_exact_fails_closed
  native-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI
          ref: 8406da920f9df19cbc14b76aef1bcd3dc4cf1119
          path: _deps/ComfyUI
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kijai/ComfyUI-KJNodes
          ref: c9869eade9920a1b949de07c4a197156006bcceb
          path: _deps/KJNodes
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-Spectrum-MiniMax-H3
          ref: 7f7b9b2d13476ea8b631de946ad48ce0fd33a8a5
          path: _deps/Spectrum
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-Untwisting-RoPE
          ref: cf428e204f42354ce9a9582dd956906f75a52974
          path: _deps/Untwist
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-DiffAid-Patches
          ref: ba9d9efbcf7e64c755e068cb76547d8cc85481eb
          path: _deps/DiffAid
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/MiniMax-H3-Flow-Aligned-Regenerate
          ref: a6bf395133c8ce496217ca9194f3ab3f2b9181ef
          path: _deps/Flow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-VDN-H3-Plus
          ref: b6f0755c4172ec5c17386c56998f454e78b2a2d4
          path: _deps/VDN
          persist-credentials: false
      - name: Apply VDN SOL-provider overlay after audio overlay
        run: |
          git -C _deps/VDN fetch origin 5b63dc670229d419a6350b64f7ceda609dbc8194
          git -C _deps/VDN -c user.name=ci -c user.email=ci@example.invalid cherry-pick 5b63dc670229d419a6350b64f7ceda609dbc8194
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.10.0+cpu torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r _deps/ComfyUI/requirements.txt
      - run: pip install -e '.[test]'
      - run: python -m pytest -q tests/test_sana_contract.py tests/test_real_comfy_interop.py tests/test_spectrum_stack.py tests/test_real_diffaid_stack.py tests/test_flow_mixed_history.py tests/test_flow_mixed_measure_contract.py tests/test_weighted_measure_routes.py tests/test_flow_weighted_measure_contract.py
        env:
          COMFYUI_PATH: ${{ github.workspace }}/_deps/ComfyUI
          KJNODES_PATH: ${{ github.workspace }}/_deps/KJNodes
          SPECTRUM_PATH: ${{ github.workspace }}/_deps/Spectrum
          UNTWIST_PATH: ${{ github.workspace }}/_deps/Untwist
          DIFFAID_PATH: ${{ github.workspace }}/_deps/DiffAid
          FLOW_PATH: ${{ github.workspace }}/_deps/Flow
          VDN_PATH: ${{ github.workspace }}/_deps/VDN
