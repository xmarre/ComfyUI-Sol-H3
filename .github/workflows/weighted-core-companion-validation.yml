name: Weighted core companion validation

on:
  push:
    branches:
      - validation/mixed-grid-weighted-core-pr-20260911

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI
          ref: efd54b9a17ce422a2cdbed76d5e7a87671f253c2
          path: _deps/ComfyUI
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install "pytest>=8"
      - name: Run provider/core contract tests
        env:
          PYTHONPATH: ${{ github.workspace }}/_deps/ComfyUI:${{ github.workspace }}
        run: python -m pytest -q tests/test_weighted_measure.py
