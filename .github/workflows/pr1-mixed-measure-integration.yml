name: PR1 Flow Mixed-Grid measure integration

on:
  push:
    branches:
      - mirror/pr1-mixed-measure-integration

permissions:
  contents: write

jobs:
  integration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: efa6c8f804bff78b46a0fd458ebd2e47bba07a30
          path: _deps/ComfyUI
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: kijai/ComfyUI-KJNodes
          ref: c9869eade9920a1b949de07c4a197156006bcceb
          path: _deps/KJNodes
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-Spectrum-MiniMax-H3
          ref: 9c682c07f4c5ea9de601cda234755a1561b59f59
          path: _deps/Spectrum
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-Untwisting-RoPE
          ref: cf428e204f42354ce9a9582dd956906f75a52974
          path: _deps/Untwist
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-DiffAid-Patches
          ref: ba9d9efbcf7e64c755e068cb76547d8cc85481eb
          path: _deps/DiffAid
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/MiniMax-H3-Flow-Aligned-Regenerate
          ref: 0a80f1d8b31bae7ece2c426a8a12705764df1e0d
          path: _deps/Flow
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-VDN-H3-Plus
          ref: b6f0755c4172ec5c17386c56998f454e78b2a2d4
          path: _deps/VDN
          persist-credentials: false
      - name: Apply VDN SOL-provider overlay after audio overlay
        run: |
          git -C _deps/VDN fetch origin 5b63dc670229d419a6350b64f7ceda609dbc8194
          git -C _deps/VDN -c user.name=ci -c user.email=ci@example.invalid cherry-pick 5b63dc670229d419a6350b64f7ceda609dbc8194
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU integration environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0+cpu torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r _deps/ComfyUI/requirements.txt
          python -m pip install -e '.[test]'
      - name: Validate exact Flow/Sol measure contract and production interop
        env:
          COMFYUI_PATH: ${{ github.workspace }}/_deps/ComfyUI
          KJNODES_PATH: ${{ github.workspace }}/_deps/KJNodes
          SPECTRUM_PATH: ${{ github.workspace }}/_deps/Spectrum
          UNTWIST_PATH: ${{ github.workspace }}/_deps/Untwist
          DIFFAID_PATH: ${{ github.workspace }}/_deps/DiffAid
          FLOW_PATH: ${{ github.workspace }}/_deps/Flow
          VDN_PATH: ${{ github.workspace }}/_deps/VDN
        run: |
          python -m ruff check sol_h3/mixed_measure.py sol_h3/runtime.py sol_h3/sparse.py tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py tests/test_flow_mixed_measure_contract.py tests/test_flow_mixed_history.py
          python -m pytest -q \
            tests/test_mixed_measure.py \
            tests/test_external_mixed.py \
            tests/test_attention_guard.py \
            tests/test_interop.py \
            tests/test_flow_mixed_measure_contract.py \
            tests/test_flow_mixed_history.py \
            tests/test_sana_contract.py \
            tests/test_real_comfy_interop.py \
            tests/test_spectrum_stack.py \
            tests/test_real_diffaid_stack.py
      - name: Remove temporary integration workflow and checkpoint
        if: success()
        run: |
          rm .github/workflows/pr1-mixed-measure-integration.yml
          git add -A
          git diff --check --cached
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Validate Flow Mixed-Grid measure integration'
          git push
