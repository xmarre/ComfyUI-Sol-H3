name: Route-bound weighted measure transform

on:
  push:
    branches:
      - mirror/mixed-grid-weighted-provider-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply route binding fix
        run: python tools/dev_bind_weighted_routes.py
      - name: Static validation
        run: |
          python -m py_compile sol_h3/runtime.py sol_h3/weighted_measure.py tests/test_weighted_runtime.py
          git diff --check
      - name: Commit and remove development helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/weighted-route-binding-dev.yml tools/dev_bind_weighted_routes.py
          git add sol_h3/runtime.py
          git commit -m 'Bind weighted receipts to executed numerical route'
          git push origin HEAD:mirror/mixed-grid-weighted-provider-20260910
