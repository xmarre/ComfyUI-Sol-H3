name: PR1 mixed measure rebase

on:
  push:
    branches:
      - mirror/pr1-mixed-measure-rebase-current

permissions:
  contents: write

jobs:
  rebase-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply validated aggregate Mixed-Grid measure delta
        shell: bash
        run: |
          set -euxo pipefail
          FILES=(
            sol_h3/mixed_measure.py
            sol_h3/runtime.py
            sol_h3/sparse.py
            tests/test_mixed_measure.py
            tests/test_external_mixed.py
            tests/test_attention_guard.py
          )
          git diff --binary af4bbe62d507767dcecc4e6716548160f757dcf9 8134789a4bdd6b580ac9cb0c077e2ceb92157f7c -- "${FILES[@]}" > /tmp/mixed-measure.patch
          test -s /tmp/mixed-measure.patch
          git apply --3way --index /tmp/mixed-measure.patch
          git diff --check --cached
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Focused validation
        run: |
          ruff check sol_h3/mixed_measure.py sol_h3/runtime.py sol_h3/sparse.py tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py
          ruff format --check sol_h3/mixed_measure.py sol_h3/runtime.py sol_h3/sparse.py tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py
          pytest -q tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py tests/test_interop.py
      - name: Commit validated rebase and remove workflow
        shell: bash
        run: |
          rm .github/workflows/pr1-mixed-measure-rebase.yml
          git add -A
          git diff --check --cached
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Add Mixed-Grid attention-measure K/V normalization'
          git push
