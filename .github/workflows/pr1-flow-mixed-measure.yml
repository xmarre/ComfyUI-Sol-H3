name: PR1 Flow mixed K/V measure

on:
  push:
    branches:
      - mirror/pr1-flow-mixed-kv-measure

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/pr1_mixed_measure_patch.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' build
      - name: Focused validation
        run: |
          ruff check sol_h3/mixed_measure.py sol_h3/runtime.py sol_h3/sparse.py tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py
          ruff format --check sol_h3/mixed_measure.py sol_h3/runtime.py sol_h3/sparse.py tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py
          pytest -q tests/test_mixed_measure.py tests/test_external_mixed.py tests/test_attention_guard.py tests/test_interop.py
      - name: Remove temporary patch machinery and commit
        run: |
          rm tools/pr1_mixed_measure_patch.py .github/workflows/pr1-flow-mixed-measure.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Normalize Flow Mixed-Grid K/V attention measure'
          git push
