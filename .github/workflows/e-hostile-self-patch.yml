name: E hostile self patch

on:
  push:
    branches:
      - mirror/first-high-sol-local-e-implementation-20260915
    paths:
      - .github/workflows/e-hostile-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/e_hostile_patch.py
      - run: python -m compileall -q sol_h3/first_high_sol_local_diagnostic.py
      - name: Commit patched source and remove one-shot patcher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol_h3/first_high_sol_local_diagnostic.py
          git rm .github/e_hostile_patch.py .github/workflows/e-hostile-self-patch.yml
          git commit -m "Harden first-high E operator witnesses"
          git push origin HEAD:mirror/first-high-sol-local-e-implementation-20260915
