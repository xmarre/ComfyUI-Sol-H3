name: PR2 Mixed-Grid measure history fix
on:
  push:
    branches: [mirror/pr2-measure-history-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr2-measure-history-fix
          fetch-depth: 0
      - name: Patch history identity and receipt ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sol_h3/interop.py')
          text = path.read_text()

          old = '''        mixed_segments = tuple(mixed_layout.segments)\n        inner_blocks = len(inner.blocks)\n    except (AttributeError, TypeError, ValueError):\n'''
          new = '''        mixed_segments = tuple(mixed_layout.segments)\n        inner_blocks = len(inner.blocks)\n        attention_measure = plan.attention_measure\n    except (AttributeError, TypeError, ValueError):\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        or source_rows <= 0\n        or target_rows <= source_rows\n        or len(target_hw) != 2\n'''
          new = '''        or source_rows <= 0\n        or target_rows <= source_rows\n        or type(attention_measure) is not bool\n        or len(target_hw) != 2\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''        source_rows,\n        target_rows,\n        target_hw,\n        repr(getattr(layout, "signature", None)),\n'''
          new = '''        source_rows,\n        target_rows,\n        target_hw,\n        attention_measure,\n        repr(getattr(layout, "signature", None)),\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''                "sol", "sol_external_mixed", "dense_warmup", "vdn_local_sol", "vdn_dense_warmup",\n'''
          new = '''                "sol", "sol_external_mixed", "sol_external_mixed_measure", "dense_warmup",\n                "vdn_local_sol", "vdn_dense_warmup",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text)

          test = Path('tests/test_attention_guard.py')
          body = test.read_text()
          marker = 'def test_history_policy_accepts_external_mixed_measure_receipts():'
          assert marker not in body
          body += '''\n\n\ndef test_history_policy_accepts_external_mixed_measure_receipts():\n    from sol_h3.interop import HistoryPolicy\n\n    policy = HistoryPolicy(object())\n    assert policy.accept_receipts([("sol_h3", 0, "sol_external_mixed_measure")])\n    assert policy.accept_receipts([\n        ("sol_h3", 0, "dense_warmup"),\n        ("sol_h3", 1, "sol_external_mixed_measure"),\n    ])\n    assert not policy.accept_receipts([("sol_h3", 0, "unknown_measure_route")])\n'''
          test.write_text(body)

          flow_test = Path('tests/test_flow_mixed_history.py')
          body = flow_test.read_text()
          old = '''        source_w=4,\n        prefix_noise=torch.randn_like(prefix),\n    )\n'''
          new = '''        source_w=4,\n        prefix_noise=torch.randn_like(prefix),\n        attention_measure=True,\n    )\n'''
          assert body.count(old) == 1
          flow_test.write_text(body.replace(old, new, 1))
          PY
      - name: Validate focused contracts
        run: |
          python -m compileall -q sol_h3 tests
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m ruff check sol_h3/interop.py tests/test_attention_guard.py tests/test_flow_mixed_history.py
          python -m pytest -q tests/test_attention_guard.py
      - name: Commit patch and remove temporary workflow
        run: |
          rm .github/workflows/pr2-measure-history-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sol_h3/interop.py tests/test_attention_guard.py tests/test_flow_mixed_history.py .github/workflows/pr2-measure-history-fix.yml
          git commit -m 'Preserve Spectrum history for Mixed-Grid measure route'
          git push origin HEAD:mirror/pr2-measure-history-fix
