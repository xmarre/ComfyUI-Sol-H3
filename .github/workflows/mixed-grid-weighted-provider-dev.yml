name: Weighted Mixed-Grid provider development transform

on:
  push:
    branches:
      - mirror/mixed-grid-weighted-provider-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: xmarre/Sana
          ref: 2936c47637380842aaa4a4488fac5006cc542b70
          path: _deps/Sana
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source transform
        run: python tools/dev_apply_weighted_measure.py
      - name: Regenerate vendored patch and manifest
        run: |
          python tools/dev_regenerate_vendor_patch.py
          python tools/vendor_sol_attn.py _deps/Sana
      - name: Structural validation
        run: |
          python -m py_compile sol_h3/weighted_measure.py sol_h3/runtime.py sol_h3/interop.py sol_h3/sparse.py sol_h3/_vendor/sol_attn/interface.py sol_h3/_vendor/sol_attn/sm120/kernel.py sol_h3/_vendor/sol_attn/sm120/mainloop.py tools/vendor_sol_attn.py tests/test_sparse.py tests/test_sana_contract.py
          git diff --check -- . ':(exclude)tools/rectangular_sm120.patch'
          grep -q 'sol_external_mixed_weighted_measure' sol_h3/runtime.py
          grep -q 'key_bias\[absolute_col\]' sol_h3/_vendor/sol_attn/sm120/mainloop.py
          grep -q 'reduce_kv(k, v, measure_validated)' sol_h3/runtime.py
      - name: Commit implementation and remove development helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/mixed-grid-weighted-provider-dev.yml tools/dev_apply_weighted_measure.py tools/dev_regenerate_vendor_patch.py
          git add sol_h3 tools/rectangular_sm120.patch tools/vendor_sol_attn.py tests/test_sparse.py tests/test_sana_contract.py
          git commit -m 'Add generic weighted Mixed-Grid Sol-H3 provider'
          git push origin HEAD:mirror/mixed-grid-weighted-provider-20260910
