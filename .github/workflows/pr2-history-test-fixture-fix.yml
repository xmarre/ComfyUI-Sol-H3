name: PR2 history fixture coverage fix
on:
  push:
    branches: [mirror/pr2-measure-history-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/pr2-measure-history-fix
          fetch-depth: 0
      - name: Patch synthetic Flow fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_history_transparent_replacements.py')
          s = p.read_text()
          old = 'def _flow_mixed_wrapper(previous, layer, *, source_rows=4, target_rows=16):\n'
          new = 'def _flow_mixed_wrapper(previous, layer, *, source_rows=4, target_rows=16, attention_measure=False):\n'
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''        mixed_rows=mixed_rows,\n        target_hw=(8, 8),\n    )\n'''
          new = '''        mixed_rows=mixed_rows,\n        target_hw=(8, 8),\n        attention_measure=attention_measure,\n    )\n'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          marker = 'def test_malformed_flow_mixed_grid_closure_remains_opaque():'
          assert marker in s
          test = '''def test_flow_mixed_grid_attention_measure_change_changes_history_identity():\n    cfg = Config(exact=False, backend="sol", dense_evaluations=0, dense_layers=0)\n    plain = {}\n    measured = {}\n    plain_layout = measured_layout = None\n    for layer in range(2):\n        plain_wrap, plain_layout = _flow_mixed_wrapper(BlockPatch(layer, cfg), layer)\n        measured_wrap, measured_layout = _flow_mixed_wrapper(\n            BlockPatch(layer, cfg), layer, attention_measure=True\n        )\n        plain[("double_block", layer)] = plain_wrap\n        measured[("double_block", layer)] = measured_wrap\n    plain_id = _policy_identity(\n        cfg, {"patches_replace": {"dit": plain}}, blocks=2, layout=plain_layout\n    )\n    measured_id = _policy_identity(\n        cfg, {"patches_replace": {"dit": measured}}, blocks=2, layout=measured_layout\n    )\n    assert plain_id is not None and measured_id is not None and measured_id != plain_id\n\n\n'''
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY
      - name: Validate history contracts
        run: |
          python -m pip install torch==2.10.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]'
          python -m ruff check sol_h3/interop.py tests/test_attention_guard.py tests/test_history_transparent_replacements.py tests/test_flow_mixed_history.py
          python -m pytest -q tests/test_attention_guard.py tests/test_history_transparent_replacements.py
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/pr2-history-test-fixture-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_history_transparent_replacements.py .github/workflows/pr2-history-test-fixture-fix.yml
          git commit -m 'Cover Mixed-Grid measure history identity'
          git push origin HEAD:mirror/pr2-measure-history-fix
