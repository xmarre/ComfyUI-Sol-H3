name: E detailed metric self patch

on:
  push:
    branches:
      - mirror/first-high-sol-local-e-implementation-20260915
    paths:
      - .github/workflows/e-metrics-self-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/e_metrics_patch.py
      - run: python -m pip install ruff
      - run: ruff format sol_h3/first_high_sol_local_diagnostic.py
      - run: ruff check --fix sol_h3/first_high_sol_local_diagnostic.py
      - run: ruff check sol_h3/first_high_sol_local_diagnostic.py
      - run: python -m compileall -q sol_h3/first_high_sol_local_diagnostic.py
      - name: Commit patch and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sol_h3/first_high_sol_local_diagnostic.py
          git rm .github/e_metrics_patch.py .github/workflows/e-metrics-self-patch.yml
          git commit -m "Add bounded detailed first-high E metrics"
          git push origin HEAD:mirror/first-high-sol-local-e-implementation-20260915
