[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-sol-h3"
version = "0.1.1"
description = "Native ComfyUI MiniMax-H3 exact runtime and composable Sana Sol-Attn integration"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "torch",
    "triton>=3.6.0,<4; sys_platform == 'linux'",
    "nvidia-cutlass-dsl[cu13]>=4.5.0; sys_platform == 'linux'",
    "cuda-python; sys_platform == 'linux'",
    "apache-tvm-ffi>=0.1.11; sys_platform == 'linux'",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-Sol-H3"
Documentation = "https://github.com/xmarre/ComfyUI-Sol-H3#readme"
"Bug Tracker" = "https://github.com/xmarre/ComfyUI-Sol-H3/issues"

[tool.setuptools.packages.find]
include = ["sol_h3*"]

[tool.setuptools.package-data]
sol_h3 = ["native_manifest.json", "sol_manifest.json", "_vendor/LICENSE.*", "_vendor/*.json", "_vendor/sol_attn/THIRD_PARTY_NOTICES.md", "_vendor/sol_attn/sm100/LICENSE.flash-attention"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires CUDA and Triton; not a CPU parity claim"]

[tool.ruff]
line-length = 120
extend-exclude = ["sol_h3/_vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "ComfyUI Sol-H3"
Icon = ""
