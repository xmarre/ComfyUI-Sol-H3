[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-sol-h3"
version = "0.1.0"
description = "Native ComfyUI MiniMax-H3 exact affine fusion and experimental SOL attention"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "ruff"]

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-Sol-H3"

[tool.setuptools.packages.find]
include = ["sol_h3*"]

[tool.setuptools.package-data]
sol_h3 = ["sol_manifest.json", "native_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["gpu: requires CUDA and Triton; not a CPU parity claim"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "ComfyUI Sol-H3"
